<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>로그인 · SUNO Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f1f5f9;font:15px/1.7 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
main{width:100%;max-width:530px;background:#1e293b;border:1px solid #334155;border-radius:15px;padding:34px}h1{margin:0 0 12px;color:#c4b5fd;font-size:28px}.muted{color:#94a3b8;font-size:14px}input{width:100%;margin:12px 0;padding:13px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:white;font:inherit}button{width:100%;padding:12px;border:0;border-radius:8px;background:#7c3aed;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:#c4b5fd}#error{color:#fca5a5;white-space:pre-wrap}code{color:#c4b5fd}
</style>
</head>
<body><main>
<h1>♫ SUNO Manager</h1>
<p class="muted">Suno 토큰으로 개인 라이브러리를 연결하세요.</p>
<form id="login-form">
    <label for="token">Bearer 토큰</label>
    <input id="token" name="token" type="password" required autocomplete="off" placeholder="Bearer eyJ… 또는 eyJ…">
    <button type="submit">로그인</button>
    <p id="error" role="alert"></p>
</form>
<details><summary>토큰 가져오는 방법</summary>
    <ol class="muted">
        <li><a href="https://suno.com" target="_blank" rel="noopener">Suno</a>에 로그인합니다.</li>
        <li>개발자 도구(F12) → Network에서 새로고침합니다.</li>
        <li><code>feed/v3</code> 요청의 Headers → Request Headers → <code>authorization</code> 값을 복사합니다.</li>
    </ol>
</details>
<p class="muted">입력한 토큰은 서버 메모리에 보관하며, 로그아웃·서버 재시작 시 삭제됩니다. .env 토큰은 파일에 유지됩니다. 만료되면 새 토큰이 필요합니다.</p>
</main>
<script>
document.getElementById('login-form').addEventListener('submit', async event => {
    event.preventDefault();
    const button = event.target.querySelector('button'), error = document.getElementById('error');
    button.disabled = true; button.textContent = '확인 중…'; error.textContent = '';
    try {
        const response = await fetch('/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: document.getElementById('token').value.trim()})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '로그인에 실패했습니다.');
        window.location.href = '/';
    } catch (failure) { error.textContent = failure.message; }
    finally { button.disabled = false; button.textContent = '로그인'; }
});
</script>
</body></html>
