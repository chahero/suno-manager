<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SUNO Manager{% endblock %}</title>
    <style>
        :root{color-scheme:dark;--bg:#0f172a;--card:#1e293b;--border:#334155;--muted:#94a3b8;--accent:#a78bfa}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f5f9;font:15px/1.6 system-ui,-apple-system,sans-serif}
        a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit}
        button,.button{border:1px solid var(--border);border-radius:8px;padding:9px 15px;background:#334155;color:#f1f5f9;cursor:pointer;display:inline-block}
        button:hover,.button:hover{background:#475569;text-decoration:none}button:disabled{opacity:.5;cursor:wait}.primary{background:#7c3aed;border-color:#8b5cf6}.primary:hover{background:#6d28d9}
        input:not([type=checkbox]),select{border:1px solid var(--border);border-radius:8px;background:var(--bg);color:#f1f5f9;padding:10px 12px;max-width:100%}
        input[type=checkbox]{width:17px;height:17px;accent-color:#8b5cf6;cursor:pointer}
        aside{position:fixed;inset:0 auto 0 0;width:240px;background:#111b2e;border-right:1px solid var(--border);padding:28px 20px;display:flex;flex-direction:column;gap:24px}
        .brand{font-size:23px;font-weight:750;color:#c4b5fd;letter-spacing:-.5px}nav{display:grid;gap:8px}nav a{display:block;padding:11px 14px;border-radius:8px;color:#cbd5e1}nav a.active{background:#7c3aed33;color:#c4b5fd}nav a:hover{background:var(--card);text-decoration:none}
        main{margin-left:240px;max-width:1500px;padding:34px 40px 140px}h1{font-size:29px;line-height:1.3;margin:0 0 8px}h2{font-size:20px;margin:0 0 18px}h3{margin:0}.muted{color:var(--muted)}.small{font-size:13px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:23px;margin-top:22px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spacer{flex:1}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.metric strong{display:block;font-size:30px;margin-top:7px}
        .notice{white-space:pre-wrap;border-radius:8px;background:#172554;border:1px solid #3b82f6;padding:14px;margin:20px 0}.notice.error{background:#451a1a;border-color:#f87171}
        [hidden]{display:none!important}.quota{margin-top:auto;font-size:13px;padding:15px;border:1px solid var(--border);border-radius:10px}.quota strong{display:block;font-size:19px;color:#f1f5f9;margin:5px 0}
        .table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th{color:var(--muted);font-size:13px;font-weight:500}th,td{padding:14px 9px;border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:0}.song-title{font-weight:650;display:block}.song-info{min-width:200px;max-width:420px}.song-id{overflow-wrap:anywhere}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:12px;color:#cbd5e1}
        .recent-item{display:flex;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid var(--border)}.recent-item:last-child{border:0}.cover{width:50px;height:50px;object-fit:cover;border-radius:8px;background:#334155}
        .player{position:fixed;bottom:0;left:240px;right:0;background:#111b2ef5;border-top:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:20px}.player audio{flex:1;max-width:700px;height:40px}.player-title{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        dialog{max-width:750px;width:calc(100% - 40px);max-height:85vh;background:var(--card);color:#f1f5f9;border:1px solid var(--border);border-radius:12px;padding:25px}dialog::backdrop{background:#0009}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.empty{text-align:center;padding:40px;color:var(--muted)}.list{padding-left:20px}.list li{margin-bottom:10px}code{background:var(--bg);padding:3px 6px;border-radius:4px}
        @media(max-width:900px){aside{position:static;width:auto;padding:18px 20px;gap:12px}nav{display:flex;flex-wrap:wrap}nav a{padding:7px 12px}.quota{margin:0;padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.quota strong{display:inline;font-size:15px}main{margin-left:0;padding:24px 20px 150px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.player{left:0;flex-wrap:wrap;gap:8px}.player audio{min-width:180px}.card{padding:16px}}
        @media(max-width:480px){h1{font-size:25px}.metrics{gap:10px}.metric strong{font-size:25px}.toolbar input:not([type=checkbox]){width:100%}.player-title{max-width:180px}.quota>div{display:flex;align-items:center;gap:8px}}
    </style>
</head>
<body>
    <aside>
        <a class="brand" href="/">♫ SUNO Manager</a>
        <nav aria-label="메인 메뉴">
            <a href="/" class="{{ 'active' if request.endpoint == 'index' else '' }}">대시보드</a>
            <a href="/library" class="{{ 'active' if request.endpoint == 'library' else '' }}">음악 라이브러리</a>
            <a href="/logout">로그아웃</a>
        </nav>
        <div class="quota">
            <div><span class="muted" id="plan-name">계정 확인 중</span><strong id="credits-count">— 크레딧</strong></div>
            <div><span class="muted">새 다운로드 남은 횟수</span><strong id="downloads-count">—</strong></div>
            <span id="connection-status" class="muted">연결 확인 중…</span>
            <a id="refresh-token-link" class="button" href="/login" hidden>새 토큰으로 로그인</a>
        </div>
    </aside>
    <main>
        <div id="notice" class="notice" role="status" hidden></div>
        {% block content %}{% endblock %}
    </main>
    <div id="player" class="player" hidden>
        <strong id="player-title" class="player-title"></strong>
        <audio id="audio-player" controls preload="metadata"></audio>
        <button type="button" id="close-player" aria-label="플레이어 닫기">닫기</button>
    </div>
    <dialog id="lyrics-dialog">
        <div class="toolbar"><h2 id="lyrics-title">가사</h2><span class="spacer"></span><button id="close-lyrics" type="button">닫기</button></div>
        <pre id="lyrics-text"></pre>
    </dialog>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
